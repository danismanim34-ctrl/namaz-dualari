import 'package:flutter/material.dart';

void main() {
  runApp(const NamazDualariApp());
}

class NamazDualariApp extends StatelessWidget {
  const NamazDualariApp({super.key});

  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'Namaz Duaları',
      theme: ThemeData(
        primarySwatch: Colors.teal,
        useMaterial3: true,
      ),
      home: const DuaListScreen(),
    );
  }
}

